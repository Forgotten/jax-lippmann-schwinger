[project]
name = "jax-ls"
version = "0.1.0"
description = "Solving the Lippmann-Schwinger equation using JAX for acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Leonardo Zepeda-Núñez", email = "lzepeda@melix.org" }
]
dependencies = [
  "numpy",
  "scipy",
  "jax",
  "jaxlib",
  "flax",
]

[tool.ruff]
line-length = 80
indent-width = 2

[tool.ruff.format]
indent-style = "space"
