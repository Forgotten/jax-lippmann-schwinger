[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-ls"
version = "0.1.0"
description = "Solving the Lippmann-Schwinger equation using JAX for acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Leonardo Zepeda-Núñez", email = "lzepeda@melix.org" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "scipy",
  "jax",
  "jaxlib",
  "flax",
]

[project.urls]
Homepage = "https://github.com/Forgotten/jax-lippmann-schwinger"

# Ship only the library.  Without this, flat-layout auto-discovery also picks up
# `examples`, which would install a top-level module of that name into
# site-packages.
[tool.setuptools.packages.find]
include = ["jax_ls*"]

[tool.ruff]
line-length = 80
indent-width = 2

[tool.ruff.format]
indent-style = "space"
